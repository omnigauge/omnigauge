/* ─────────────────────────────────────────────────────────────────────────────
   Turbo Vision, rebuilt rather than emulated.

   1985 chose that blue because CGA had sixteen colours and blue was the one
   that did not hurt after eight hours. The palette here keeps the relationships
   — blue field, cyan structure, yellow for the thing that needs you — and drops
   the parts that were hardware limits: #0000AA is corrected to a blue with some
   depth, the drop shadows are real alpha instead of a dithered character, and
   the type is hinted rather than a 9x16 ROM bitmap.

   No fonts, no CDN, no analytics, no framework. One file. A tool whose claim is
   that it reads local files should not have a homepage that phones out.
   ───────────────────────────────────────────────────────────────────────────── */
:root{
  /* CGA had sixteen colours and used all of them at once because it could.
     A modern reading keeps the relationships and drops the shouting: the field
     desaturates, the structure recedes, and saturation is spent only where a
     number needs you. Nothing here is at full chroma except a critical row. */
  --field:#091228;      /* the desktop */
  --panel:#0e1b3c;      /* raised surface, barely above the field */
  --edge:#22345f;       /* panel border */
  --shadow:rgba(1,4,14,.45);
  /* Measured against WCAG AA, not eyeballed. On --panel: white 13.1, cyan 6.2,
     yellow 6.5, gray 5.8, dim 4.6, red 4.8, green 6.1 - all >= 4.5. The old
     dim (#4e5c7d) sat at 2.5 on panel: atmospheric, and unreadable in sunlight.
     Recovery is luminance-only - same hues, same restraint, more light. */
  --white:#dbe3f2; --cyan:#5aa6c9; --yellow:#c9974f; --gray:#8a98b6;
  --dim:#7686aa; --red:#c47070; --green:#6ea888;
  --barbg:#8d9cbe; --barink:#091228; --hot:#582121;
  --mono:'OGMono',ui-monospace,SFMono-Regular,"SF Mono",Menlo,"DejaVu Sans Mono",Consolas,monospace;
}
/* Android Chrome font-boosts small text unless told not to - it inflated
   the 78-column solve past the right edge and amputated every panel. The
   grid does its own size math; the browser does not get a vote. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{color:var(--white);font-family:var(--mono);
     /* the famous desktop was never a flat fill — it was a ▒ dither, because a
        flat expanse of CGA blue banded horribly. Rendered here as a 4px dot
        lattice at 3% instead of a character, which is what it always wanted
        to be. */
     background-color:var(--field);
     background-image:radial-gradient(circle at 1px 1px,rgba(150,185,255,.045) 1px,transparent 0);
     background-size:4px 4px;
     font-size:13px;line-height:1.38;overflow:hidden;
     -webkit-font-smoothing:antialiased;text-rendering:optimizeSpeed}
/* set by fit(): one number drives the whole interface, so a phone gets the
   same 78 columns as a 5K display rather than a different, worse layout */
html{--fs:13px}
body{font-size:var(--fs)}

/* the faintest nod to a phosphor mask — present, never a costume */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.010) 0 1px,transparent 1px 3px);
  mix-blend-mode:overlay}

/* ── menu bar ─────────────────────────────────────────────────────────────── */
#menu{position:fixed;top:0;left:0;right:0;height:1.65em;background:var(--barbg);
  color:var(--barink);display:flex;align-items:center;gap:1.5em;padding:0 1.1em;z-index:60;
  font-size:.94em;letter-spacing:.02em;box-shadow:0 .18em .45em rgba(1,4,14,.35)}
#menu span{cursor:pointer;user-select:none;padding:0 .35em}
#menu span:hover{background:var(--barink);color:var(--barbg)}
#menu u{color:var(--hot);text-decoration:none}
#menu .rt{margin-left:auto;color:#29324d}   /* 4.6:1 on the bar; was 2.4 */
#menu span.on{background:var(--barink);color:var(--barbg)}
#drop{position:fixed;z-index:70;background:var(--barbg);color:var(--barink);
  box-shadow:.5em .3em 0 var(--shadow);border:1px solid #8fa0c8;display:none;
  padding:.25em 0;min-width:15em;font-size:.96em}
#drop div{padding:.12em 1.1em;cursor:pointer;white-space:nowrap}
#drop div:hover,#drop div.sel{background:var(--barink);color:var(--barbg)}
#drop u{color:var(--hot);text-decoration:none}
#drop div:hover u,#drop div.sel u{color:var(--yellow)}
#drop hr{border:0;border-top:1px solid #8fa0c8;margin:.25em 0}

/* ── screen ───────────────────────────────────────────────────────────────── */
#scr{height:100%;overflow-y:auto;overflow-x:hidden;padding:2.7em .9em 3.2em;
  scrollbar-width:none}
#scr::-webkit-scrollbar{display:none}
/* The block is 78 columns and margin:auto centres it exactly — but the ink does
   not fill it. Loose lines run a median of 43 columns, so their weight sits left
   of the box's centre and the page reads as left-aligned even though it is not.
   Optical centring: shift right by roughly half the shortfall. --nudge is the
   only knob; raise it to push further right, set it to 0 for true geometry. */
:root{--nudge:6ch}
#page{width:max-content;margin:0 auto;padding-bottom:1.2em;
      transform:translateX(var(--nudge))}
@media (max-width:820px){:root{--nudge:0ch}}   /* no room to spare on a phone */
#out{white-space:pre}
/* A copyable string longer than the mobile grid: the DIV soft-wraps so the
   screen stays contained, while the text stays ONE line for select-and-copy. */
#out .cmd{white-space:pre-wrap;word-break:break-all}
b{font-weight:400}
.c{color:var(--cyan)} .y{color:var(--yellow)} .g{color:var(--green)}
.r{color:var(--red)}  .d{color:var(--gray)}   .f{color:var(--dim)}
.w{color:var(--white)}
a{color:var(--cyan)}

/* Turbo Vision drew its shadow with ░ characters. This is that idea with alpha. */
/* No horizontal padding. The box-drawing characters ARE the border, so any
   inset pushes a panel's left edge right of every line that is not in a panel —
   boot text, the prompt, loose lines — and the page gets a zigzag left margin
   instead of one edge running top to bottom. */
.pan{display:block;width:max-content;background:var(--panel);background-image:none;
  padding:.2em 0;box-shadow:.5em .32em 0 var(--shadow);border:0;margin:.15em 0 .5em}

.ln{display:flex;align-items:baseline;gap:0;margin-top:.9em;flex-wrap:wrap;
  border-top:1px solid rgba(120,150,220,.10);padding-top:.75em}
.ps{color:var(--yellow);flex:none;margin-right:.6ch}
/* sized to its own content in ch units — a monospace ch IS the advance width,
   so the block cursor lands exactly where the next character will. flex:1 put
   the input across the whole row and pushed the cursor to the far margin. */
#in{background:transparent;border:0;outline:0;color:var(--white);font:inherit;
  flex:none;width:1ch;min-width:0;padding:0;caret-color:transparent}
#cur{flex:none;color:var(--white);animation:bl 1.06s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

/* ── function key bar ─────────────────────────────────────────────────────── */
#keys{position:fixed;left:0;right:0;bottom:0;height:1.7em;display:flex;
  align-items:stretch;z-index:60;font-size:.9em;background:var(--field);
  padding:0 .55em;box-shadow:0 -.18em .45em rgba(1,4,14,.35)}
#keys b{display:flex;align-items:center;color:var(--dim);padding:0 .4em 0 .55em;flex:none}
#keys i{display:flex;align-items:center;background:var(--barbg);color:var(--barink);
  padding:0 .65em;font-style:normal;cursor:pointer;flex:none;letter-spacing:.01em}
#keys i:hover{background:var(--white)}
#keys .sp{flex:1;background:var(--field)}

@media (prefers-reduced-motion:reduce){
  #cur,.crit b.r:first-child{animation:none}body::after{display:none}}

/* On a touch screen the chrome gets real targets. The 78-column grid is the
   page CONTENT and is untouched - the menu and key bars are fixed chrome
   outside the grid, so they can grow without costing a single column. */
@media (pointer:coarse){
  #menu{font-size:max(.94em,13px);height:2.1em}
  #keys{font-size:max(.9em,13px);height:3em}
  #keys i{padding:0 .9em}
  #drop{font-size:max(.96em,14px)}

/* On a narrow screen the key bar overflowed off the right edge - Legend and
   Saver were there, just past the horizon. Wrap instead of clip; the spacer
   only made sense on one line. */
/* Mobile: one calm row of essentials. The F-numbers are a desktop
   affordance; the rest of the commands live in the menus. */
@media (max-width:700px){
  #keys{height:2.6em;padding:0 .4em;justify-content:space-around}
  #keys b,#keys .x,#keys .sp{display:none}
  #keys i{flex:1;justify-content:center;margin:0 2px}
  #scr{padding-bottom:4.2em}
  /* max-content sizing lets one long copyable line inflate the whole
     column; capped, the line soft-wraps and the screen stays contained */
  #page{max-width:100%}
}

/* real content for a screen reader, invisible to everyone else */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;
    clip-path:inset(50%);white-space:nowrap}
/* the Turbo Vision dialog: centred, double border, hard shadow, one button
   that already has focus — because in 1985 you could not assume a mouse */
#modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;
  justify-content:center;background:rgba(4,10,34,.35)}
#modal.on{display:flex}
#modal .box{background:var(--panel);box-shadow:.7em .45em 0 var(--shadow);
  border:1px solid var(--edge);width:fit-content;
  min-width:min(24em,92vw);max-width:92vw}
#modal .tb{background:var(--barbg);color:var(--barink);padding:.1em .8em;
  display:flex;justify-content:space-between;align-items:center}
#modal .tb u{color:var(--hot);text-decoration:none;cursor:pointer;padding:0 .3em}
#modal .bd{padding:1em 1.4em .6em;white-space:pre-wrap;color:var(--white)}
#modal .bt{padding:.4em 0 1em;text-align:center}
#modal button{font:inherit;background:var(--barbg);color:var(--barink);border:0;
  padding:.15em 2.2em;cursor:pointer;box-shadow:.35em .25em 0 var(--shadow)}
#modal button:hover,#modal button:focus{background:var(--white);outline:0}

/* A critical reading should not sit there politely. It pulses BRIGHTER, not
   dimmer: fading to opacity .55 blended the red into the panel at 2.3:1 - the
   moment of emphasis was the moment it became unreadable. The bright phase
   stays above 4.5:1 the whole cycle. */
@keyframes bk{0%,100%{color:var(--red)}50%{color:#e2a5a5}}
.crit b.r:first-child{animation:bk 1.9s ease-in-out infinite}
/* the address is the one string here anybody needs to move; make it behave
   like something you can pick up */
b.addr{cursor:pointer;border-bottom:1px dotted rgba(201,151,79,.45)}
b.addr:hover{color:var(--white)}

/* DOS screensavers existed because phosphor burned. This one is a joke that
   knows it is a joke, and any key kills it. */
#saver{position:fixed;inset:0;z-index:90;background:var(--field);display:none;
  overflow:hidden;cursor:none}
#saver.on{display:block}
#saver div{position:absolute;white-space:pre;color:var(--cyan);font-size:1.05em}

#crt{position:fixed;inset:0;z-index:95;background:#cfe0f5;pointer-events:none;
  animation:strike .42s ease-out forwards}
@keyframes strike{
  0%{opacity:.95;transform:scaleY(.004)}
  22%{opacity:.75;transform:scaleY(.03)}
  48%{opacity:.30;transform:scaleY(1)}
  100%{opacity:0;transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){#crt{display:none}}

noscript div{white-space:normal;max-width:68ch;color:var(--gray);padding:1em 0}

<noscript><div>
  <h1>OmniGauge</h1>
  <p>Every AI plan you pay for, on one screen. Claude Code, OpenAI Codex and Grok CLI —
  plan quota, token volume, burn rate and time to reset, side by side in your terminal.</p>
  <p>Each vendor reports usage in a different unit, over a different window, in a different
  direction. Codex counts down, Claude counts up, Grok gives raw tokens against a cap, Gemini
  says "limited". OmniGauge normalizes all of it to percent consumed against a common window,
  so you can see which plan runs out first.</p>
  <p>No keys for the part that matters — quota and tokens are read from what your agents
  already write to disk. The optional dollar-spend panel does take vendor keys: stored 0600,
  never passed as arguments, refused outright if group- or world-readable. Leave it off and
  no credential or network call is involved. No telemetry. One Python file, no dependencies,
  MIT.</p>
  <pre>git clone https://github.com/omnigauge/omnigauge.git
install -m755 omnigauge/omnigauge ~/.local/bin/omnigauge
omnigauge --refresh</pre>

<script>
(function(){
var RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
var out=document.getElementById('out'),scr=document.getElementById('scr'),
    inp=document.getElementById('in'),prom=document.getElementById('prompt');
var MOBILE=false, W=78, IN=76;
function setMode(m){MOBILE=m; W=m?42:78; IN=W-2;}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function wrapWords(t,w){
  var out=[],cur='';
  t.split(/\s+/).forEach(function(x){
    while(x.length>w){if(cur){out.push(cur);cur='';}out.push(x.slice(0,w));x=x.slice(w);}
    var c=(cur?cur+' ':'')+x;
    if(c.length<=w||!cur)cur=c;else{out.push(cur);cur=x;}
  });
  out.push(cur);return out;
}
function prose(cls,text){
  wrapWords(text,IN-4).forEach(function(l){row('  [['+cls+']]'+l+'[[/]]');});
}
function vis(s){return s.replace(/\[\[[a-z]\]\]|\[\[\/\]\]/g,'').length;}
function pad(s,n){return s+' '.repeat(Math.max(0,n-vis(s)));}
function rpad(s,n){return ' '.repeat(Math.max(0,n-vis(s)))+s;}
/* Column widths live in one place. A number column that is left-padded puts
   24%, 0% and 97% at three different columns, which is exactly the comparison
   the whole tool exists to make possible. */
var COL={mark:4,agent:18,window:9,bar:20,used:8,reset:12};
function paint(s){return esc(s).replace(/\[\[([cygrdfw])\]\]/g,'<b class="$1">')
  .replace(/\[\[\/\]\]/g,'</b>');}
function line(s,cls){var d=document.createElement('div');
  if(cls)d.className=cls;d.innerHTML=paint(s||' ');out.appendChild(d);return d;}
function blank(){line(' ');}
function bottom(){scr.scrollTop=scr.scrollHeight;}

/* ── double-line panels, the way DOS drew a dialog ───────────────────────── */
var open=null;
function pan(){var d=document.createElement('div');d.className='pan';
  out.appendChild(d);open=d;return d;}
function put(s){var d=document.createElement('div');d.innerHTML=paint(s||' ');
  (open||out).appendChild(d);return d;}
function head(t,sub){
  pan();
  headsSince.push(t.toLowerCase());
  var l='[[c]]╔══[[/]][[w]]▌ '+t+' ▐[[/]]', r=sub?'[[d]] '+sub+' [[/]]':'';
  if(IN-vis(l)-vis(r)+1<2)r='';
  put(l+'[[c]]'+'═'.repeat(Math.max(2,IN-vis(l)-vis(r)+1))+'[[/]]'+r+'[[c]]╗[[/]]');
}
function row(t){return put('[[c]]║[[/]]'+pad(t||'',IN)+'[[c]]║[[/]]');}
/* A meter that is simply present has no weight. Filling it costs 420ms and
   makes the number feel measured rather than asserted.

   Only the 28 columns that move - the bar and the percentage - are rewritten
   per frame. The frame, labels and reset column paint once. The old version
   rebuilt, re-escaped and re-parsed the entire row every frame of every
   meter: ~125 full-row innerHTML parses per board. */
function meterRow(el,left,right){
  el.innerHTML=paint(left);
  var seg=document.createElement('b');
  el.appendChild(seg);
  var tail=document.createElement('b');
  tail.innerHTML=paint(right);
  el.appendChild(tail);
  return seg;
}
function meter(seg,target){
  var draw=function(v){seg.innerHTML=paint(bar(v)+rpad(Math.round(v)+'%',COL.used));};
  if(RM){draw(target);return;}
  var t0=null;
  requestAnimationFrame(function step(t){
    if(t0===null)t0=t;
    var k=Math.min(1,(t-t0)/420), e=1-Math.pow(1-k,3);
    draw(target*e);
    if(k<1)requestAnimationFrame(step);
  });
}
function foot(n){
  if(n&&IN-vis('[[d]] '+n+' [[/]]')-2<2)n='';
  if(n){var s='[[d]] '+n+' [[/]]';
    put('[[c]]╚══[[/]]'+s+'[[c]]'+'═'.repeat(Math.max(2,IN-vis(s)-2))+'╝[[/]]');}
  else put('[[c]]╚'+'═'.repeat(IN)+'╝[[/]]');
  open=null;
}
function mbar(p,w){
  var full=Math.round(p/100*w), col=p>=90?'r':p>=70?'y':p>=1?'g':'f';
  return '[['+col+']]'+'▒'.repeat(full)+'[[/]][[f]]'+'·'.repeat(Math.max(0,w-full))+'[[/]]';
}
function bar(p,w){w=w||20;
  var full=Math.round(p/100*w), col=p>=90?'r':p>=70?'y':p>=1?'g':'f';
  return '[['+col+']]'+'▓'.repeat(full)+'[[/]][[f]]'+'·'.repeat(Math.max(0,w-full))+'[[/]]';
}


/* A 5x5 block font, because the machines that owned this blue had no other way
   to set type large. Nine glyphs is all this word needs. */
var GLY={
 O:['█████','█   █','█   █','█   █','█████'],
 M:['█   █','██ ██','█ █ █','█   █','█   █'],
 N:['█   █','██  █','█ █ █','█  ██','█   █'],
 I:['█████','  █  ','  █  ','  █  ','█████'],
 G:['█████','█    ','█  ██','█   █','█████'],
 A:['█████','█   █','█████','█   █','█   █'],
 U:['█   █','█   █','█   █','█   █','█████'],
 E:['█████','█    ','████ ','█    ','█████']};
function wordmark(){
  if(!MOBILE){
    var a='OMNI'.split(''), b='GAUGE'.split('');
    for(var r=0;r<5;r++){
      var L=a.map(function(ch){return GLY[ch][r];}).join(' ');
      var R=b.map(function(ch){return GLY[ch][r];}).join(' ');
      line('  [[c]]'+L+'[[/]] [[d]]'+R+'[[/]]');
    }
    return;
  }
  var C=6,parts=[],x=0;
  [['OMNI','var(--cyan)'],['GAUGE','var(--gray)']].forEach(function(w,wi){
    if(wi)x+=C;
    w[0].split('').forEach(function(ch){
      GLY[ch].forEach(function(rowstr,r){
        rowstr.split('').forEach(function(cell,ci){
          if(cell==='█')parts.push('<rect x="'+(x+ci*C)+'" y="'+(r*C)+
            '" width="'+(C*0.86)+'" height="'+(C*0.86)+'" fill="'+w[1]+'"/>');
        });
      });
      x+=6*C;
    });
  });
  var d=document.createElement('div');
  d.innerHTML='<svg viewBox="0 0 '+(x-C)+' '+(5*C)+'" role="img" aria-label="OMNIGAUGE" '+
    'style="width:min(56vw,220px);height:auto;display:block;margin:.5em 0 .3em">'+
    parts.join('')+'</svg>';
  out.appendChild(d);
}

/* ── live figures ────────────────────────────────────────────────────────── */
var S={dry:15120,tok:2.032,burn:180};
/* The ticker rewrites exactly these two rows. The old version ran
   querySelectorAll over every panel row ever printed, every second, reading
   each one's textContent - a cost that grew with the scrollback forever. */
var LIVE={dry:null,today:null};
function dryRow(){return MOBILE?'  [[f]]'+pad('dry in',8)+'[[/]][[y]]'+fmt(S.dry)+'[[/]]'
  :'  [[f]]dry in[[/]]         [[y]]'+fmt(S.dry)+'[[/]] [[d]]at that pace[[/]]';}
function todayRow(){return MOBILE?'  [[f]]'+pad('today',8)+'[[/]][[c]]'+S.tok.toFixed(3)+'B[[/]] [[d]]tokens[[/]]'
  :'  [[f]]today[[/]]          [[c]]'+S.tok.toFixed(3)+'B[[/]] [[d]]tokens across three agents[[/]]';}
/* Height was the obvious way to draw a week, and it cost seven partial-block
   glyphs — the same family that rendered the CLI panels ragged, because a font
   without them substitutes a face with a different advance. Intensity carries
   the shape instead: one glyph the terminals all have, four colour steps. */
function spark(v){var mx=Math.max.apply(null,v);
  return v.map(function(x){
    var k=x/mx, c=k>=.85?'r':k>=.6?'y':k>=.3?'g':'f';
    return '[['+c+']]█[[/]]';
  }).join(' ');}
function fmt(s){var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);
  return h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}

function board(){
  if(MOBILE){
    head('PLAN QUOTA');
    row('');
    [['claude','week',28,'4d 09h'],['claude','session',16,'5:19am'],
     ['claude/fable','week',5,'4d 09h'],['codex','week',100,'4d 14h'],
     ['codex/spark','week',0,'6d 17h'],
     ['grok/x premium+','week',41,'2d 04h']].forEach(function(r){
      var crit=r[2]>=90;
      var m=r[2]>=1?(crit?'[[r]]■[[/]]':'[[g]]■[[/]]'):'[[f]]□[[/]]';
      var col=crit?'r':r[2]>=70?'y':r[2]>=1?'g':'f';
      var el=row('  '+m+' [[w]]'+pad(r[0].slice(0,17),18)+'[[/]]'
        +'[['+col+']]'+rpad(Math.round(r[2])+'%',5)+'[[/]]');
      if(crit)el.classList.add('crit');
      row('  '+mbar(r[2],26));
      row('  [[f]]'+r[1]+' · resets '+r[3]+'[[/]]');
      if(r[0]==='codex')row('  [[f]]"0% left" - inverted[[/]]');
      row('');
    });
    foot('normalized to % consumed');
    blank();
    head('LIVE');
    row('');
    row('  [[f]]'+pad('burn',8)+'[[/]][[c]]'+S.burn+'K[[/]] [[d]]tok/hr[[/]]');
    LIVE.dry=row(dryRow());
    LIVE.today=row(todayRow());
    row('');
    row('  [[f]]'+pad('7 days',8)+'[[/]]'+spark([31,44,38,72,66,91,97]));
    row('');
    foot('real readings, 15 Aug');
    return;
  }
  head('PLAN QUOTA','normalized to % consumed');
  row('');
  row('[[f]]'+pad('',COL.mark)+pad('AGENT',COL.agent)+pad('WINDOW',COL.window)+pad('',COL.bar)+rpad('USED',COL.used)+rpad('RESETS IN',COL.reset)+'[[/]]');
  /* Real readings off the author's machine, 15 Aug 2026. Not invented, not
     rounded to look tidy — codex really was at 100% with four days to run. */
  [['claude','week',28,'4d 09h'],['claude','session',16,'5:19am'],
   ['claude/fable','week',5,'4d 09h'],['codex','week',100,'4d 14h'],
   ['codex/spark','week',0,'6d 17h'],
   ['grok/x premium+','week',41,'2d 04h']].forEach(function(r){
    var crit=r[2]>=90;
    var m=r[2]>=1?(crit?'[[r]]■[[/]]':'[[g]]■[[/]]'):'[[f]]□[[/]]';
    var left='[[c]]║[[/]]'+pad('  '+m,COL.mark)+pad(r[0],COL.agent)+pad(r[1],COL.window);
    var fill=IN-COL.mark-COL.agent-COL.window-COL.bar-COL.used-COL.reset;
    var right=rpad(r[3],COL.reset)+' '.repeat(Math.max(0,fill))+'[[c]]║[[/]]';
    var el=row(''), seg=meterRow(el,left,right);
    meter(seg,r[2]);
    if(crit)el.classList.add('crit');
  });
  row('    [[f]]codex reported "0% left" - inverted to match the others[[/]]');
  row('');
  foot('subscription windows · no dollar balance exists for these plans');
  blank();
  head('LIVE','this page is doing the arithmetic, not showing a picture');
  row('');
  row('  [[f]]burn rate[[/]]      [[c]]'+S.burn+'K[[/]] [[d]]tokens/hour[[/]]');
  LIVE.dry=row(dryRow());
  LIVE.today=row(todayRow());
  row('');
  row('  [[f]]last 7 days[[/]]    '+spark([31,44,38,72,66,91,97])+'  [[f]]Mon - Sun[[/]]');
  row('');
  foot('real readings, 15 Aug 2026, one machine - yours will differ');
}

/* ── providers legend ─────────────────────────────────────────────────────
   LEGEND is GENERATED from providers/ by ops/gen_legend.py - this page is
   static and cannot read a live registry, so a test (tests/test_site.py)
   fails whenever this block disagrees with the code. Edit providers/, run
   the generator; never edit the data by hand. */

var CAPORDER=['tokens','quota','reset','models','lifetime','spend','burn'];
function LROWS(){return LEGEND.sources||LEGEND;}
function legendPanel(){
  var short={lifetime:'LIFE',models:'MODEL'};
  blank();
  if(MOBILE){
    head('PROVIDERS');row('');
    LROWS().forEach(function(p){
      var g=0,y=0,u=0;
      CAPORDER.forEach(function(c){
        var st=(p.c[c]||'').split(':')[0].trim();
        if(st==='obtained')g++;else if(st==='available')y++;else u++;});
      row('  [[w]]'+pad(p.n.slice(0,11),11)+'[[/]][[d]]'+pad(p.k,7)+'[[/]]'
          +'[[g]]'+g+'●[[/]] [[y]]'+y+'○[[/]] [[f]]'+u+'-[[/]]');});
    row('');foot('● has · ○ could · - cannot');
    blank();
    head('THE REASONS');row('');
    var first=false;
    LROWS().forEach(function(p){
      var noted=CAPORDER.filter(function(c){return (p.c[c]||'').indexOf(':')>=0;});
      if(!noted.length)return;
      if(first)row('');
      first=true;
      row('  [[w]]'+p.n+'[[/]]');
      noted.forEach(function(c){
        var v=p.c[c], st=v.split(':')[0].trim(), why=v.slice(v.indexOf(':')+1).trim();
        var mark=st==='obtained'?'[[g]]●[[/]]':st==='available'?'[[y]]○[[/]]':'[[f]]-[[/]]';
        var lines=wrapWords(why||st,IN-16);
        row('  '+mark+' [[d]]'+pad(c,9)+lines[0]+'[[/]]');
        for(var i=1;i<lines.length;i++)
          row('              [[d]]'+lines[i]+'[[/]]');
      });
    });
    row('');foot('the glyph is the state');
    if(LEGEND.negatives&&LEGEND.negatives.length){
      blank();
      head('NEGATIVES');row('');
      LEGEND.negatives.forEach(function(n,i){
        if(i)row('');
        row('  [[f]]-[[/]] [[w]]'+n.n+'[[/]]');
        wrapWords(n.why,IN-8).forEach(function(l){row('    [[d]]'+l+'[[/]]');});});
      row('');foot('read on real installs');
    }
    blank();return;
  }
  head('PROVIDERS','what ships, what it gets, and what it cannot get');row('');
  row('  [[f]]'+pad('SOURCE',11)+pad('KIND',6)+CAPORDER.map(function(c){
    return rpad((short[c]||c).toUpperCase(),8);}).join('')+'[[/]]');
  LROWS().forEach(function(p){
    var cells=CAPORDER.map(function(c){
      var st=(p.c[c]||'').split(':')[0].trim();
      return rpad(st==='obtained'?'[[g]]●[[/]]':st==='available'?'[[y]]○[[/]]'
                  :'[[f]]-[[/]]',8);}).join('');
    row('  [[w]]'+pad(p.n.slice(0,11),11)+'[[/]][[d]]'+pad(p.k,6)+'[[/]]'+cells);});
  row('');foot('● obtained · ○ available, not read yet · - unavailable');
  blank();
  head('THE REASONS','the third state is the honest one');row('');
  /* Grouped by source; the STATE is the glyph, so the words are only the
     why. Wraps break on words - a note snapped mid-word reads like a
     rendering bug - and a repo test caps note length so none wraps today. */
  var firstDone=false;
  LROWS().forEach(function(p){
    var noted=CAPORDER.filter(function(c){return (p.c[c]||'').indexOf(':')>=0;});
    if(!noted.length)return;
    if(firstDone)row('');
    firstDone=true;
    row('  [[w]]'+p.n+'[[/]]');
    noted.forEach(function(c){
      var v=p.c[c], st=v.split(':')[0].trim(), why=v.slice(v.indexOf(':')+1).trim();
      var mark=st==='obtained'?'[[g]]●[[/]]':st==='available'?'[[y]]○[[/]]':'[[f]]-[[/]]';
      var lines=wrapWords(why||st,61);
      row('  '+mark+' [[d]]'+pad(c,9)+lines[0]+'[[/]]');
      for(var i=1;i<lines.length;i++)

    });
  });
  row('');foot('the glyph is the state; the words are why');
  if(LEGEND.negatives&&LEGEND.negatives.length){
    blank();

      row('  [[f]]-[[/]] [[w]]'+pad(n.n,12)+'[[/]][[d]]'+n.why+'[[/]]');});
    row('');foot('a missing provider with a reason beats a broken one');

var PAL=['#5aa6c9','#c9974f','#6ea888','#c47070','#8d9cbe','#a98fc4','#c9c07a'],
    pi=0, corners=0, bounced=0;
/* The wake-on-any-input listener is registered after the key handler, so a
   keystroke that starts the saver also reaches the waker and kills it inside
   the same event — it turned on and off before a frame was ever drawn. The
   command worked only because it happened to defer with a timeout.

   Two guards, because relying on listener order is how this broke: start on a
   timeout so the current event finishes first, and refuse to wake within a
   moment of starting, whatever the order turns out to be. */
var darkAt=0;

    sx+=dx;sy+=dy;

    var hx=(sx<=0||sx>=w), hy=(sy<=0||sy>=h);
    if(hx)dx=-dx; if(hy)dy=-dy;

      bounced++;

      sv.querySelectorAll('b').forEach(function(b){b.style.color=PAL[pi];});
    }
    if(hx&&hy){                                   /* the corner. actually hit. */

/* ── one grid, every screen ────────────────────────────────────────────────
   The advance width of a monospace glyph is not a constant across platforms —
   it is roughly .6em, but "roughly" puts the right-hand │ off the screen on a
   phone. So measure the real ratio in the real font, then solve for the size
   that makes 78 columns exactly fill the viewport. */
setTimeout(function(){var c=document.getElementById('crt');if(c)c.remove();},700);

function fit(){
  var probe=document.createElement('span');
  probe.style.cssText='position:absolute;visibility:hidden;white-space:pre;'+
    'font-family:var(--mono);font-size:100px';
  probe.textContent='0'.repeat(78);
  document.body.appendChild(probe);
  var per=probe.getBoundingClientRect().width/100;   // px of width per 1px font-size
  var pad=parseFloat(getComputedStyle(document.getElementById('scr')).paddingLeft)*2;
  var avail=document.documentElement.clientWidth-pad-2;
  var size=avail/per;
  var wantMobile=size<9;
  if(wantMobile!==MOBILE){setMode(wantMobile); if(booted)rerender();}
  if(MOBILE){avail-=4;size=avail/(per/78*42);}   // deliberate right-side slack
  size=Math.max(6.2,Math.min(MOBILE?15:14.5,size));
  /* The 100px probe predicts; the phone disposes. Glyph hinting at small
     sizes is not linear, so the rendered grid can come out a few px wider
     than the solve - and overflow-x:hidden then slices the right border in
     half. Verify a real row at the APPLIED size and shrink until it
     provably fits. */
  probe.textContent='0'.repeat(W);
  for(var i=0;i<4;i++){
    probe.style.fontSize=size.toFixed(2)+'px';
    var real=probe.getBoundingClientRect().width;
    if(real<=avail)break;
    size=Math.max(6.2,size*avail/real-0.05);
  }
  probe.remove();
  document.documentElement.style.setProperty('--fs',size.toFixed(2)+'px');
  fitVerify();
}
/* The probe is one font; the frame is another story. A phone that pulls the
   box-drawing glyphs from a fallback face with a wider advance renders the
   head and border rows wider than the text rows AT THE SAME column count -
   a defect no synthetic probe can see, and exactly what clipped the right
   border on a real phone. So measure the rows that actually rendered,
   glyphs and all (scrollWidth sees the text; a block's rect only sees the
   box), and shrink until the widest one provably fits. */
var fvQueued=false;
function fitVerify(){
  if(fvQueued)return; fvQueued=true;
  requestAnimationFrame(function(){
    fvQueued=false;
    for(var tries=0;tries<2;tries++){
      var cs=getComputedStyle(scr);
      var room=scr.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
      var mx=0, rows=out.getElementsByTagName('div');
      for(var i=0;i<rows.length;i++)
        if(rows[i].scrollWidth>mx)mx=rows[i].scrollWidth;
      if(!mx||mx<=room+0.5)return;
      var cur=parseFloat(getComputedStyle(document.documentElement)
        .getPropertyValue('--fs'))||14;
      var next=Math.max(6.2,cur*room/mx-0.05);
      if(next>=cur)return;
      document.documentElement.style.setProperty('--fs',next.toFixed(2)+'px');
    }
  });
}
