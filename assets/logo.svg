<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="OmniGauge">
  <title>OmniGauge</title>

  <!--
    Three gauges, stacked. Many plans, one instrument.

    Each row is a plan's quota bar as the board draws it: eight cells, the
    used ones lit, the rest dark sockets. Top and bottom are healthy - green,
    a couple of cells in. The middle is out: every cell red. That is the
    thing this tool exists to show you, in one shape - the plan that is
    already gone sitting between two that are fine.

    Rendered, not flat: each lit cell carries a three-stop gradient - light
    at the top, deep at the base - and each empty cell is a recessed socket
    with a shadow at its lip. No rims, no highlight caps: they read as fussy
    little borders. The gradient alone carries the depth; flat rectangles
    read as a chart, shaded tiles in sockets read as a meter.

    Colours are the board's own: green and rose from the ink palette, the
    dark field, the faint socket. Sits on the dark field only.

    Geometry: 8 cells x 16 wide on a 21 pitch, rows 30 tall on a 48 pitch,
    starting at (44,66). At 16px the three rows still read as three bars.
  -->

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8d8bc"/><stop offset=".5" stop-color="#6ea888"/><stop offset="1" stop-color="#366850"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eea8a8"/><stop offset=".5" stop-color="#c47070"/><stop offset="1" stop-color="#783838"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- shadows under lit cells -->
  <g fill="#01040e" opacity=".55">
    <rect x="46" y="71" width="16" height="30" rx="3"/><rect x="67" y="71" width="16" height="30" rx="3"/>
    <rect x="46" y="119" width="16" height="30" rx="3"/><rect x="67" y="119" width="16" height="30" rx="3"/><rect x="88" y="119" width="16" height="30" rx="3"/><rect x="109" y="119" width="16" height="30" rx="3"/><rect x="130" y="119" width="16" height="30" rx="3"/><rect x="151" y="119" width="16" height="30" rx="3"/><rect x="172" y="119" width="16" height="30" rx="3"/><rect x="193" y="119" width="16" height="30" rx="3"/>
    <rect x="46" y="167" width="16" height="30" rx="3"/><rect x="67" y="167" width="16" height="30" rx="3"/><rect x="88" y="167" width="16" height="30" rx="3"/>
  </g>

  <!-- sockets: the empty cells -->
  <g fill="#1e2a4a">
    <rect x="86" y="66" width="16" height="30" rx="3"/><rect x="107" y="66" width="16" height="30" rx="3"/><rect x="128" y="66" width="16" height="30" rx="3"/><rect x="149" y="66" width="16" height="30" rx="3"/><rect x="170" y="66" width="16" height="30" rx="3"/><rect x="191" y="66" width="16" height="30" rx="3"/>
    <rect x="107" y="162" width="16" height="30" rx="3"/><rect x="128" y="162" width="16" height="30" rx="3"/><rect x="149" y="162" width="16" height="30" rx="3"/><rect x="170" y="162" width="16" height="30" rx="3"/><rect x="191" y="162" width="16" height="30" rx="3"/>
  </g>
  <!-- socket lips -->
  <g fill="#01040e" opacity=".28">
    <rect x="86" y="66" width="16" height="8" rx="3"/><rect x="107" y="66" width="16" height="8" rx="3"/><rect x="128" y="66" width="16" height="8" rx="3"/><rect x="149" y="66" width="16" height="8" rx="3"/><rect x="170" y="66" width="16" height="8" rx="3"/><rect x="191" y="66" width="16" height="8" rx="3"/>
    <rect x="107" y="162" width="16" height="8" rx="3"/><rect x="128" y="162" width="16" height="8" rx="3"/><rect x="149" y="162" width="16" height="8" rx="3"/><rect x="170" y="162" width="16" height="8" rx="3"/><rect x="191" y="162" width="16" height="8" rx="3"/>
  </g>

  <!-- lit cells -->
  <g>
    <rect x="44" y="66" width="16" height="30" rx="3" fill="url(#g)"/><rect x="65" y="66" width="16" height="30" rx="3" fill="url(#g)"/>
    <rect x="44" y="114" width="16" height="30" rx="3" fill="url(#r)"/><rect x="65" y="114" width="16" height="30" rx="3" fill="url(#r)"/><rect x="86" y="114" width="16" height="30" rx="3" fill="url(#r)"/><rect x="107" y="114" width="16" height="30" rx="3" fill="url(#r)"/><rect x="128" y="114" width="16" height="30" rx="3" fill="url(#r)"/><rect x="149" y="114" width="16" height="30" rx="3" fill="url(#r)"/><rect x="170" y="114" width="16" height="30" rx="3" fill="url(#r)"/><rect x="191" y="114" width="16" height="30" rx="3" fill="url(#r)"/>
    <rect x="44" y="162" width="16" height="30" rx="3" fill="url(#g)"/><rect x="65" y="162" width="16" height="30" rx="3" fill="url(#g)"/><rect x="86" y="162" width="16" height="30" rx="3" fill="url(#g)"/>
  </g>
</svg>
