# Publish omnigauge to PyPI on a version tag - by trusted publishing (OIDC), no token anywhere.
# PyPI is configured to trust this repository + this workflow file. A tag `vX.Y.Z` must equal
# the version in pyproject.toml (which a test already pins to the file's VERSION) or nothing
# is published.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write   # the OIDC token PyPI exchanges for a short-lived upload token
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag must be the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag" = "$ver" || { echo "tag v$tag != pyproject $ver"; exit 1; }
      - run: python3 -m pip install -q pytest build
      - run: python3 -m pytest -q
      - run: python3 ops/gen_readme_pypi.py --verify && python3 ops/gen_legend.py --verify
      - run: python3 -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
