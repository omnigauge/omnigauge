# Publish omnigauge to PyPI on a version tag, once the owner approves it on GitHub - by trusted
# publishing (OIDC), no token anywhere. PyPI is configured to trust this repository + this workflow
# file. A tag `vX.Y.Z` must equal the version in pyproject.toml (which a test already pins to the
# file's VERSION) or nothing is published.
# The approval: the job runs in the environment `release`, whose required reviewer is the owner, so
# a tag pushed by mistake publishes nothing until someone approves it in the browser. The GitHub
# Release (release.yml) and the reproducibility check (reproducible.yml) are called from here once
# PyPI has the version, so that one approval is the release's only one.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write   # the OIDC token PyPI exchanges for a short-lived upload token
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/omnigauge/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: the tag must be the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag" = "$ver" || { echo "tag v$tag != pyproject $ver"; exit 1; }
      - run: python3 -m pip install -q --require-hashes -r .github/requirements/publish.txt
      - run: python3 -m pytest -q
      - run: python3 ops/gen_readme_pypi.py --verify && python3 ops/gen_legend.py --verify
      - run: python3 -m build
      # Trusted publishing, and PEP 740 attestations: PyPI records a signed statement that THIS
      # workflow, from THIS commit, built each file (the default of the action, stated here so
      # that it is a choice and not an accident). PyPI shows them per file; a reader can check
      # https://pypi.org/integrity/omnigauge/<version>/<file>/provenance
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
  release:
    needs: publish
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
  reproducible:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/reproducible.yml
