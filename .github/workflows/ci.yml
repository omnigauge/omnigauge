# The tests and the generated-file checks on every pull request and push to main (publish.yml
# runs them again on a tag). What a Dependabot PR has to pass; what Scorecard's CI check reads.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m pip install -q --require-hashes -r .github/requirements/ci.txt
      - run: python3 -m pytest -q
      - if: matrix.python == '3.12'
        run: python3 ops/gen_readme_pypi.py --verify && python3 ops/gen_legend.py --verify
