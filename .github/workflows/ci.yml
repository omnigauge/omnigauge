# The tests and the generated-file checks on every pull request and push to main (publish.yml
# runs them again on a tag). What a Dependabot PR has to pass; what Scorecard's CI check reads.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m pip install -q --require-hashes -r .github/requirements/ci.txt
      - run: python3 -m pytest -q
      - if: matrix.python == '3.12'
        run: python3 ops/gen_readme_pypi.py --verify && python3 ops/gen_legend.py --verify
