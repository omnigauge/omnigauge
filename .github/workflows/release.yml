# On a version tag: the GitHub Release with that version's CHANGELOG section as the notes, and
# as assets the wheel and sdist built from the tag (byte-identical to PyPI's: reproducible.yml
# checks that) and a CycloneDX SBOM of the installed package. Runs beside publish.yml; can be run
# by hand for a past version.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'release to (re)create, e.g. 1.0.9 (checks out tag v<version>)'
        required: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # creating the GitHub Release and attaching its assets
      id-token: write        # Sigstore, for the attestation of the wheel and sdist
      attestations: write    # the attestation record
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: notes = this version's section of CHANGELOG.md
        id: notes
        run: |
          ver="${{ github.event.inputs.version }}"
          test -n "$ver" || ver="${GITHUB_REF_NAME#v}"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "title=omnigauge $ver" >> "$GITHUB_OUTPUT"
          awk -v ver="$ver" 'BEGIN{p=0} /^## /{ if(p) exit; if($2==ver){p=1; next} } p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $ver"; exit 1; }
      - name: build from the tag, and the SBOM of what a user installs
        run: |
          python3 -m pip install -q --require-hashes -r .github/requirements/release.txt
          python3 -m build
          python3 -m venv /tmp/clean && /tmp/clean/bin/pip install -q dist/*.whl
          cyclonedx-py environment --output-format JSON -o omnigauge.cdx.json /tmp/clean
          ls -la dist omnigauge.cdx.json
      # A signed statement of where the two files came from (Sigstore, via GitHub): one bundle
      # naming both the wheel and the sdist by digest, bound to this workflow and this commit.
      # Check: `gh attestation verify dist/<file> --owner omnigauge`, or the Attestations tab.
      # A tag push names the tag as the source; a hand run for a past tag names main's commit
      # (the run's own context). PyPI carries its own PEP 740 attestation of the same files.
      - name: attest the wheel and the sdist
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: the bundle beside the files, and the statement as *.intoto.jsonl
        run: |
          ver="${{ steps.notes.outputs.ver }}"
          cp "${{ steps.attest.outputs.bundle-path }}" "omnigauge-$ver.sigstore.json"
          jq -c '.dsseEnvelope' "omnigauge-$ver.sigstore.json" > "omnigauge-$ver.intoto.jsonl"
          jq -e '.payloadType == "application/vnd.in-toto+json" and (.signatures | length) >= 1' "omnigauge-$ver.intoto.jsonl" >/dev/null
          jq -r '.payload' "omnigauge-$ver.intoto.jsonl" | base64 -d | jq -e '(.predicateType | startswith("https://slsa.dev/provenance/")) and ([.subject[].name] | index("omnigauge-'"$ver"'-py3-none-any.whl") != null)' >/dev/null
          ls -la omnigauge-$ver.sigstore.json omnigauge-$ver.intoto.jsonl
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.notes.outputs.ver }}
          name: ${{ steps.notes.outputs.title }}
          body_path: notes.md
          files: |
            dist/*
            omnigauge-*.sigstore.json
            omnigauge-*.intoto.jsonl
            omnigauge.cdx.json
      # The site does not deploy itself (nginx on the origin box; ops/deploy_site.sh is the deploy).
      # So the release says so, loudly, when omnigauge.dev is not serving the version just released:
      # a red run here is "deploy the site", not a broken release. The BIOS line sat at v1.0.3 for
      # three releases before this check existed.
      - name: omnigauge.dev serves this version
        run: |
          ver="${{ steps.notes.outputs.ver }}"
          got=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' https://omnigauge.dev/ | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
          echo "live FACTS.version: '$got' · released: '$ver'"
          test "$got" = "$ver" || { echo "the site is behind: run ops/deploy_site.sh"; exit 1; }
